# Catálogo auditable. La configuración efectiva se instala con scripts/03-registrar-mcps.sh.
servers:
  proxmox:
    transport: streamable-http
    url: http://proxmox-mcp:8000/mcp
    risk: read
    authentication: network-boundary
    health: http://proxmox-mcp:8000/readyz
    policy:
      approval: auto
      writes: forbidden
  truenas:
    optional: true
    transport: streamable-http
    url: http://truenas-mcp:8000/mcp
    risk: read
    authentication: network-boundary
    health: http://truenas-mcp:8000/healthz
    policy:
      approval: auto
      writes: forbidden
    tools:
      - get_health
