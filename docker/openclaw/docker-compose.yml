services:
  openclaw:
    image: openclaw-custom:latest
    container_name: openclaw
    restart: unless-stopped
    environment:
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - OPENCLAW_GATEWAY_BIND=lan
    ports:
      - "18789:18789"
    volumes:
      - openclaw-config:/home/node/.openclaw
      # Necesario para que OpenClaw pueda lanzar el MCP de Proxmox (stdio-only)
      # como subproceso Docker. Esto equivale a acceso root sobre el host —
      # asumible en un homelab personal, pero ten en cuenta la implicación.
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      # GID del grupo propietario de /var/run/docker.sock en el HOST.
      # Comprueba el tuyo con: ls -la /var/run/docker.sock
      - "991"
    networks:
      - ia-net

networks:
  ia-net:
    external: true

volumes:
  openclaw-config:
